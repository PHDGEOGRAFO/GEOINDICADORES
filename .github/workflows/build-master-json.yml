name: Generar JSON maestros GeoIndicadores

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: Ruta del XLSX maestro dentro del repositorio o runner
        required: true
        default: data/source/BBDD_Visor_Geoindicadores_2025_2026.xlsx

permissions:
  contents: write

jobs:
  build-master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencia
        run: pip install openpyxl==3.1.5

      - name: Verificar fuente
        run: |
          test -f "${{ inputs.source_path }}" || {
            echo "No existe ${{ inputs.source_path }}" >&2
            echo "La BBDD Maestra no debe publicarse solo para ejecutar este flujo." >&2
            echo "Use una fuente segura en el runner o el flujo de sincronización con Google Drive cuando esté configurado." >&2
            exit 1
          }

      - name: Generar JSON maestros
        run: python scripts/build_master_json.py "${{ inputs.source_path }}" --out-dir data

      - name: Validar 27 barrios, ceros y nulos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          barrio = json.loads(Path('data/master-barrio.json').read_text(encoding='utf-8'))
          agg = json.loads(Path('data/master-aggregates.json').read_text(encoding='utf-8'))

          assert barrio['meta']['barrios_esperados'] == 27
          for year in ('2025','2026'):
              rows = barrio['anios'][year]
              assert len(rows) == 27, (year, len(rows))
              assert len({r['nombre'].strip().upper() for r in rows}) == 27
              values = [v for r in rows for v in r['valores'].values()]
              zeros = sum(v == 0 for v in values if isinstance(v, (int, float)) and not isinstance(v, bool))
              nulls = sum(v is None for v in values)
              assert zeros > 0, f'{year}: no se detectaron ceros válidos; revisar transformación'
              assert nulls > 0, f'{year}: no se detectaron nulos; revisar transformación'
              terr = agg['anios'][year]['territorio']
              assert len(terr['real']) == 6, (year, 'territorio real', len(terr['real']))
              assert len(terr['promedio']) == 6, (year, 'territorio promedio', len(terr['promedio']))
              print(f'OK {year}: 27 barrios · {zeros} ceros válidos · {nulls} nulos')
          PY

      - name: Commit de JSON derivados
        run: |
          if git diff --quiet -- data/master-barrio.json data/master-aggregates.json; then
            echo "Sin cambios en JSON maestros"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master-barrio.json data/master-aggregates.json
          git commit -m "Actualiza JSON maestros desde BBDD Maestra"
          git push
