ail=document.getElementById('detail');function esc(x){return String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function render(){group.clearLayers();const q=document.getElementById('q').value.toLowerCase().trim(),tipo=document.getElementById('tipo').value;let n=0;for(const f of DATA.features){const p=f.properties||{},txt=[p.id,p.direccion,p.rol,p.nombre,p.barrio,p.destino].join(' ').toLowerCase();if(q&&!txt.includes(q))continue;if(tipo&&p.tipo!==tipo)continue;const [lng,lat]=f.geometry.coordinates,m=L.circleMarker([lat,lng],{radius:6,color:p.tipo==='Municipal'?'#176b55':'#81561f',weight:1,fillOpacity:.82}).addTo(group);m.on('click',()=>detail.innerHTML='<span class="badge">'+esc(p.tipo)+'</span><h3>'+esc(p.id||p.nombre||'Propiedad')+'</h3><b>'+esc(p.direccion)+'</b><br>Barrio: '+esc(p.barrio)+'<br>Rol: '+esc(p.rol)+'<br>Destino: '+esc(p.destino)+'<br>Ocupación: '+esc(p.ocupacion));n++}document.getElementById('count').textContent=n+' registros visibles'}document.getElementById('q').addEventListener('input',render);document.getElementById('tipo').addEventListener('change',render);render();</script></body></html>
