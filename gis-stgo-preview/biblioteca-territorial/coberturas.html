<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coberturas GIS · Biblioteca Digital Territorial</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#edf1ef;color:#1c2b27}.wrap{max-width:1100px;margin:auto;padding:28px 5vw}h1{margin-bottom:6px}.lead{color:#66746f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#fff;border:1px solid #d8e1de;border-radius:12px;padding:16px}.btn{display:inline-block;background:#20302f;color:#fff;text-decoration:none;padding:9px 11px;border-radius:8px;font-weight:700;font-size:13px}.back{display:inline-block;margin-top:18px;color:#20302f}</style><script>(async()=>{try{const c=await fetch('access-control.json',{cache:'no-store'}).then(r=>r.json()),v=sessionStorage.getItem(c.session_key);if(!v||!(c.allowed_emails||[]).map(x=>x.toLowerCase()).includes(v.toLowerCase()))location.replace('access.html')}catch(e){location.replace('access.html')}})();</script></head><body><main class="wrap"><h1>Repositorio Territorial de Coberturas GIS / GeoPackage</h1><p class="lead">Copias web autorizadas. El catálogo continúa en depuración; los GeoPackage maestros permanecen en Drive.</p><section id="grid" class="grid"></section><a class="back" href="./">← Volver a Biblioteca Digital Territorial</a></main><script>(async()=>{const c=await fetch('catalog.json',{cache:'no-store'}).then(r=>r.json());document.getElementById('grid').innerHTML=c.categories.map(x=>`<article class="card"><strong>${x.code} · ${x.name}</strong><p>${x.file}</p><a class="btn" target="_blank" rel="noopener" href="${c.downloadBase+encodeURIComponent(x.file)}">Descargar copia web</a></article>`).join('')})().catch(()=>document.getElementById('grid').innerHTML='<p>No se pudo cargar el catálogo.</p>');</script></body></html>
