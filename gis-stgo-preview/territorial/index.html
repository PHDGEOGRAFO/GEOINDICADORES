<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visor Territorial · GIS STGO</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#eef2f0;color:#1c2925}header{height:58px;background:#172126;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px}header h1{font-size:18px;margin:0}.layout{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 58px)}aside{background:#fff;border-right:1px solid #d5dfdb;padding:15px;overflow:auto}#map{height:100%;width:100%}.box{border:1px solid #d8e0dd;border-radius:10px;padding:12px;margin-bottom:12px}.box h2{font-size:14px;margin:0 0 9px}.layer{display:block;margin:8px 0}.stat{font-size:12px;color:#64716c}.back{color:#fff;text-decoration:none;background:#32453f;padding:8px 10px;border-radius:7px}select{width:100%;padding:8px;margin-top:5px}.note{font-size:12px;line-height:1.5;color:#53635d}@media(max-width:750px){.layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{max-height:250px}.layout{height:calc(100vh - 58px)}}</style></head><body><header><h1>Visor Territorial · Santiago</h1><a class="back" href="../">← GIS STGO</a></header><div class="layout"><aside><div class="box"><h2>Capas</h2><label class="layer"><input type="checkbox" id="lComuna" checked> Límite comuna</label><label class="layer"><input type="checkbox" id="lBar" checked> Barrios</label><label class="layer"><input type="checkbox" id="lCalles"> Calles Santiago</label><label class="layer"><input type="checkbox" id="lGrif"> Grifos</label></div><div class="box"><h2>Buscar barrio</h2><select id="barrioSel"><option value="">Todos los barrios</option></select></div><div class="box"><h2>Estado</h2><div class="stat" id="status">Cargando capas reales…</div></div><div class="box note"><b>Prueba funcional.</b><br>Esta vista usa las capas reales publicadas en el repositorio territorial. Sustituye la gráfica anterior mientras seguimos reincorporando las herramientas completas del visor original.</div></aside><div id="map"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const BASE='https://raw.githubusercontent.com/PHDGEOGRAFO/VISOR-REPOSITORIO-DIGITAL/main/public/data/';
const map=L.map('map',{preferCanvas:true}).setView([-33.45,-70.66],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);
const layers={}; function nameOf(p){return p.BARRIO||p.NOM_BARRIO||p.NOMBRE||p.nombre||p.NAME||p.Name||p.COD_MZN||'Elemento territorial'}
async function get(n){const r=await fetch(BASE+n,{cache:'no-store'});if(!r.ok)throw new Error(n+' '+r.status);return r.json()}
async function init(){try{const [comuna,barrios]=await Promise.all([get('comuna.geojson'),get('barrios.geojson')]);layers.comuna=L.geoJSON(comuna,{style:{color:'#101820',weight:3,fill:false}}).addTo(map);layers.barrios=L.geoJSON(barrios,{style:{color:'#375a7f',weight:1.4,fillColor:'#5a88b5',fillOpacity:.10},onEachFeature:(f,l)=>l.bindPopup('<b>'+nameOf(f.properties||{})+'</b>')}).addTo(map);map.fitBounds(layers.comuna.getBounds(),{padding:[15,15]});const sel=document.getElementById('barrioSel');const names=[...new Set((barrios.features||[]).map(f=>nameOf(f.properties||{})))].sort((a,b)=>a.localeCompare(b,'es'));names.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o)});sel.onchange=()=>{if(!sel.value){map.fitBounds(layers.barrios.getBounds());return}let t;layers.barrios.eachLayer(l=>{if(nameOf(l.feature.properties||{})===sel.value)t=l});if(t){map.fitBounds(t.getBounds(),{padding:[25,25]});t.openPopup()}};document.getElementById('status').textContent=`Comuna cargada · Barrios: ${(barrios.features||[]).length}`;}catch(e){document.getElementById('status').textContent='Error de carga: '+e.message}}
function bindCheck(id,key,file,kind){document.getElementById(id).addEventListener('change',async e=>{if(!e.target.checked){if(layers[key])map.removeLayer(layers[key]);return}try{if(!layers[key]){const d=await get(file);layers[key]=kind==='line'?L.geoJSON(d,{style:{color:'#777',weight:.7,opacity:.5}}):L.geoJSON(d,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:3,weight:1,fillOpacity:.75}),onEachFeature:(f,l)=>l.bindPopup('<b>'+nameOf(f.properties||{})+'</b>')})}layers[key].addTo(map)}catch(err){e.target.checked=false;alert('No se pudo cargar '+file)}})}
document.getElementById('lComuna').onchange=e=>e.target.checked?layers.comuna?.addTo(map):layers.comuna&&map.removeLayer(layers.comuna);document.getElementById('lBar').onchange=e=>e.target.checked?layers.barrios?.addTo(map):layers.barrios&&map.removeLayer(layers.barrios);bindCheck('lCalles','calles','calles_santiago.geojson','line');bindCheck('lGrif','grifos','grifos.geojson','point');init();
</script></body></html>
