<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso · Biblioteca Digital</title><link rel="stylesheet" href="https://phdgeografo.github.io/GEOINDICADORES/gis-stgo-preview/module.css"><style>.gate{max-width:520px;margin:9vh auto}.gate input{width:100%;padding:12px;border:1px solid #cfd6dc;border-radius:8px;font-size:16px}.gate .actions{margin-top:12px}.error{color:#8b2f2f;margin-top:10px;min-height:20px}</style></head><body><main class="gate"><span class="eyebrow">GIS STGO · acceso controlado de previsualización</span><h1>Biblioteca Digital</h1><p class="lead">Ingrese la clave para abrir la Biblioteca Digital en esta sesión del navegador.</p><section class="panel"><label for="key"><strong>Clave de acceso</strong></label><input id="key" type="password" autocomplete="current-password" autofocus><div class="actions"><button id="enter" class="button">Ingresar</button><a class="button secondary" href="../">Volver al INDEX</a></div><div id="error" class="error" role="alert"></div><p class="muted">Esta puerta protege la previsualización estática. La publicación definitiva deberá usar autenticación de servidor.</p></section></main><script>async function sha256(t){const b=new TextEncoder().encode(t);const d=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function enter(){const cfg=await fetch('access-control.json',{cache:'no-store'}).then(r=>r.json());const typed=document.getElementById('key').value;const hash=await sha256(typed);if(hash===cfg.password_sha256){sessionStorage.setItem(cfg.session_key,'granted');location.href='index.html'}else{document.getElementById('error').textContent='Clave incorrecta.'}}document.getElementById('enter').addEventListener('click',enter);document.getElementById('key').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});</script></body></html>
