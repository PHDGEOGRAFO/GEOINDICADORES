<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maqueta 3D Santiago</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
:root{--panel:rgba(255,255,255,.96);--text:#202124;--muted:#6b7280;--line:#e5e7eb;--accent:#1f2937}
*{box-sizing:border-box}html,body,#map{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text)}#map{background:#eef1f3}
.panel{position:absolute;z-index:5;top:14px;left:14px;width:318px;background:var(--panel);border-radius:14px;box-shadow:0 4px 20px #0002;padding:14px}
.panel h1{font-size:18px;margin:0 0 2px}.sub{font-size:11px;color:var(--muted);margin-bottom:11px}.search{display:flex;gap:6px}.search input{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:8px;font-size:12px}.search button,.view button,.layers-btn{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}.view{display:flex;gap:6px;margin-top:8px}.view button{flex:1;font-weight:700;font-size:12px}.layers-btn{width:100%;margin-top:8px;text-align:left;font-weight:700}.layers{display:none;margin-top:7px;border-top:1px solid var(--line);padding-top:7px}.layers.open{display:block}.layers label{display:flex;align-items:center;gap:7px;font-size:12px;padding:5px 2px}.dot{width:10px;height:10px;border-radius:2px;display:inline-block}.legend{position:absolute;z-index:4;left:14px;bottom:22px;background:var(--panel);padding:9px 11px;border-radius:10px;box-shadow:0 2px 12px #0002;font-size:11px;line-height:1.55}.badge{display:inline-block;padding:3px 6px;border-radius:6px;background:#f3f4f6;margin-top:4px}.info{position:absolute;z-index:5;right:14px;top:14px;width:290px;background:var(--panel);border-radius:12px;box-shadow:0 3px 18px #0002;padding:13px;display:none}.info.show{display:block}.info h2{font-size:15px;margin:0 0 9px}.row{font-size:12px;border-top:1px solid var(--line);padding:6px 0}.row b{display:inline-block;width:100px}.close{float:right;border:0;background:none;font-size:18px;cursor:pointer}.maplibregl-ctrl-top-right{top:80px}@media(max-width:720px){.panel{width:calc(100% - 28px)}.info{top:auto;bottom:14px;right:14px;left:14px;width:auto}.legend{display:none}}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<h1>MAQUETA 3D SANTIAGO</h1>
<div class="sub">Prototipo visual web · Parte 1</div>
<div class="search"><input id="q" placeholder="Buscar dirección"><button id="buscar">Buscar</button></div>
<div class="view"><button id="v2d">2D</button><button id="v3d">3D</button><button id="home">Inicio</button></div>
<button class="layers-btn" id="capas">☰ CAPAS</button>
<div class="layers" id="layerPanel">
<label><input type="checkbox" id="edif" checked><span class="dot" style="background:#aeb4bc"></span>Edificaciones 3D</label>
<label><input type="checkbox" id="calles" checked><span class="dot" style="background:#ffffff;border:1px solid #aaa"></span>Mapa base y etiquetas</label>
</div>
</div>
<div class="legend"><b>MAQUETA 3D</b><br>Vista de prueba para revisar diseño, navegación y volumen urbano.<br><span class="badge">Datos 3D provisionales: OpenStreetMap/OpenFreeMap</span></div>
<div class="info" id="info"><button class="close" id="close">×</button><h2>Edificación</h2><div id="details"></div></div>
<script>
const HOME={center:[-70.6506,-33.4489],zoom:15.2,pitch:56,bearing:-20};
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/positron',...HOME,canvasContextAttributes:{antialias:true}});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
map.on('load',()=>{
  const layers=map.getStyle().layers||[]; let labelId;
  for(const l of layers){if(l.type==='symbol'&&l.layout&&l.layout['text-field']){labelId=l.id;break}}
  if(!map.getSource('openfreemap3d')) map.addSource('openfreemap3d',{url:'https://tiles.openfreemap.org/planet',type:'vector'});
  map.addLayer({id:'edificios-3d',source:'openfreemap3d','source-layer':'building',type:'fill-extrusion',minzoom:14.5,filter:['!=',['get','hide_3d'],true],paint:{'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],0],0,'#d7dbe0',15,'#bcc2c9',35,'#9da5af',70,'#737d89',120,'#515b68'],'fill-extrusion-height':['interpolate',['linear'],['zoom'],14.5,0,15.3,['coalesce',['get','render_height'],6]],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.9}},labelId);
  map.on('click','edificios-3d',e=>{const p=e.features[0].properties||{};const h=Math.round(Number(p.render_height||0));details.innerHTML=`<div class="row"><b>ALTURA 3D</b>${h?h+' m':'Sin dato'}</div><div class="row"><b>TIPO</b>Edificación</div><div class="row"><b>ESTADO</b>Referencia visual</div>`;info.classList.add('show')});
  map.on('mouseenter','edificios-3d',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','edificios-3d',()=>map.getCanvas().style.cursor='');
});
capas.onclick=()=>layerPanel.classList.toggle('open');edif.onchange=()=>map.getLayer('edificios-3d')&&map.setLayoutProperty('edificios-3d','visibility',edif.checked?'visible':'none');
calles.onchange=()=>{for(const l of map.getStyle().layers||[]){if(l.id!=='edificios-3d')try{map.setLayoutProperty(l.id,'visibility',calles.checked?'visible':'none')}catch(e){}}};
v2d.onclick=()=>map.easeTo({pitch:0,bearing:0,duration:700});v3d.onclick=()=>map.easeTo({pitch:56,bearing:-20,duration:700});home.onclick=()=>map.easeTo({...HOME,duration:900});close.onclick=()=>info.classList.remove('show');
async function buscarDir(){const s=q.value.trim();if(!s)return;const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=cl&q='+encodeURIComponent(s+', Santiago, Chile');try{const r=await fetch(url,{headers:{'Accept-Language':'es'}});const a=await r.json();if(a.length)map.flyTo({center:[+a[0].lon,+a[0].lat],zoom:17,pitch:56,duration:1000});else alert('Dirección no encontrada.');}catch(e){alert('No fue posible buscar la dirección.')}}
buscar.onclick=buscarDir;q.addEventListener('keydown',e=>e.key==='Enter'&&buscarDir());
</script>
</body></html>
