<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maqueta 3D Santiago</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
:root{--panel:rgba(255,255,255,.96);--text:#202124;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}html,body,#map{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text)}#map{background:#eef1f3}.panel{position:absolute;z-index:5;top:14px;left:14px;width:325px;background:var(--panel);border-radius:14px;box-shadow:0 4px 20px #0002;padding:14px}.panel h1{font-size:18px;margin:0 0 2px}.sub{font-size:11px;color:var(--muted);margin-bottom:11px}.search{display:flex;gap:6px}.search input{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:8px;font-size:12px}.search button,.view button,.layers-btn{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}.view{display:flex;gap:6px;margin-top:8px}.view button{flex:1;font-weight:700;font-size:12px}.layers-btn{width:100%;margin-top:8px;text-align:left;font-weight:700}.layers{display:none;margin-top:7px;border-top:1px solid var(--line);padding-top:7px;max-height:330px;overflow:auto}.layers.open{display:block}.layers label{display:flex;align-items:center;gap:7px;font-size:12px;padding:5px 2px}.dot{width:10px;height:10px;border-radius:2px;display:inline-block;flex:0 0 auto}.legend{position:absolute;z-index:4;left:14px;bottom:22px;background:var(--panel);padding:10px 12px;border-radius:10px;box-shadow:0 2px 12px #0002;font-size:11px;line-height:1.55}.legend-grid{display:grid;grid-template-columns:auto auto;gap:3px 8px;margin-top:5px}.sw{width:18px;height:9px;border:1px solid #999;display:inline-block;margin-right:5px}.note{color:#6b7280;margin-top:5px}.info{position:absolute;z-index:5;right:14px;top:14px;width:290px;background:var(--panel);border-radius:12px;box-shadow:0 3px 18px #0002;padding:13px;display:none}.info.show{display:block}.info h2{font-size:15px;margin:0 0 9px}.row{font-size:12px;border-top:1px solid var(--line);padding:6px 0}.row b{display:inline-block;width:100px}.close{float:right;border:0;background:none;font-size:18px;cursor:pointer}.maplibregl-ctrl-top-right{top:80px}@media(max-width:720px){.panel{width:calc(100% - 28px)}.info{top:auto;bottom:14px;right:14px;left:14px;width:auto}.legend{display:none}}
</style></head>
<body><div id="map"></div>
<div class="panel"><h1>MAQUETA 3D SANTIAGO</h1><div class="sub">Prototipo visual web · Parte 1</div>
<div class="search"><input id="q" placeholder="Buscar dirección"><button id="buscar">Buscar</button></div>
<div class="view"><button id="v2d">2D</button><button id="v3d">3D</button><button id="home">Inicio</button></div>
<button class="layers-btn" id="capas">☰ CAPAS</button><div class="layers" id="layerPanel">
<label><input type="checkbox" id="edif" checked><span class="dot" style="background:#8f8f8f"></span>Edificaciones 3D · escala por pisos</label>
<label><input type="checkbox" id="territorios" checked><span class="dot" style="background:#111"></span>Límites territorios PLADECO</label>
<label><input type="checkbox" id="barrios" checked><span class="dot" style="background:#555"></span>Límites barrios</label>
<label><input type="checkbox" id="vial" checked><span class="dot" style="background:#555"></span>Vialidad estructurante</label>
<label><input type="checkbox" id="verde" checked><span class="dot" style="background:#b8d6b3"></span>Parques y áreas verdes</label>
<label><input type="checkbox" id="agua" checked><span class="dot" style="background:#8ebbd1"></span>Río y cursos de agua</label>
<label><input type="checkbox" id="cerros" checked><span class="dot" style="background:#8a735e"></span>Cerros / cumbres</label>
<label><input type="checkbox" id="base" checked><span class="dot" style="background:#fff;border:1px solid #aaa"></span>Mapa base y microbarrios</label></div></div>
<div class="legend"><b>PISOS · ESCALA DE GRISES</b><div class="legend-grid"><div><span class="sw" style="background:#eeeeee"></span>1 piso</div><div><span class="sw" style="background:#d9d9d9"></span>2–3</div><div><span class="sw" style="background:#bdbdbd"></span>4–6</div><div><span class="sw" style="background:#969696"></span>7–10</div><div><span class="sw" style="background:#636363"></span>11+</div></div><div class="note">Territorio = línea gruesa; Barrio = línea fina. Microbarrios permanecen como referencia base.</div></div>
<div class="info" id="info"><button class="close" id="close">×</button><h2>Edificación</h2><div id="details"></div></div>
<script>
const HOME={center:[-70.6506,-33.4489],zoom:13.7,pitch:54,bearing:-18};
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/positron',...HOME,canvasContextAttributes:{antialias:true}});map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
function setVis(ids,on){ids.forEach(id=>{if(map.getLayer(id))map.setLayoutProperty(id,'visibility',on?'visible':'none')})}
map.on('load',()=>{const baseLayers=(map.getStyle().layers||[]).map(l=>l.id);window.BASE_IDS=baseLayers;const layers=map.getStyle().layers||[];let firstLabel;for(const l of layers){if(l.type==='symbol'&&l.layout&&l.layout['text-field']){firstLabel=l.id;break}}if(!map.getSource('ofm'))map.addSource('ofm',{url:'https://tiles.openfreemap.org/planet',type:'vector'});
map.addLayer({id:'parques-destacados',source:'ofm','source-layer':'park',type:'fill',minzoom:10,paint:{'fill-color':'#b8d6b3','fill-opacity':.55}},firstLabel);map.addLayer({id:'agua-destacada',source:'ofm','source-layer':'water',type:'fill',paint:{'fill-color':'#8ebbd1','fill-opacity':.72}},firstLabel);map.addLayer({id:'cursos-agua',source:'ofm','source-layer':'waterway',type:'line',paint:{'line-color':'#6ea3bd','line-width':['interpolate',['linear'],['zoom'],11,1,16,3],'line-opacity':.9}},firstLabel);map.addLayer({id:'vialidad-estructurante',source:'ofm','source-layer':'transportation',type:'line',minzoom:10,filter:['match',['get','class'],['trunk','primary','secondary'],true,false],paint:{'line-color':'#555b61','line-width':['interpolate',['linear'],['zoom'],10,1.2,13,2.2,16,5.5],'line-opacity':.72}},firstLabel);
map.addSource('barrios-oficiales',{type:'geojson',data:'../data/barrios.geojson'});map.addSource('territorios-oficiales',{type:'geojson',data:'../data/territorios.geojson'});
map.addLayer({id:'territorios-line',type:'line',source:'territorios-oficiales',paint:{'line-color':'#111827','line-width':['interpolate',['linear'],['zoom'],11,2.4,15,4.2],'line-opacity':.9}});map.addLayer({id:'territorios-label',type:'symbol',source:'territorios-oficiales',minzoom:11,layout:{'text-field':['get','TERRITORIO'],'text-size':['interpolate',['linear'],['zoom'],11,12,15,16],'text-font':['Noto Sans Bold'],'text-letter-spacing':.08,'text-allow-overlap':false},paint:{'text-color':'#111827','text-halo-color':'rgba(255,255,255,.95)','text-halo-width':2}});
map.addLayer({id:'barrios-line',type:'line',source:'barrios-oficiales',paint:{'line-color':'#4b5563','line-width':['interpolate',['linear'],['zoom'],11,1,15,2.2],'line-dasharray':[2,1.5],'line-opacity':.86}});map.addLayer({id:'barrios-label',type:'symbol',source:'barrios-oficiales',minzoom:12.5,layout:{'text-field':['get','BARRIO'],'text-size':['interpolate',['linear'],['zoom'],12.5,10,16,14],'text-font':['Noto Sans Bold'],'text-allow-overlap':false},paint:{'text-color':'#374151','text-halo-color':'rgba(255,255,255,.95)','text-halo-width':1.5}});
map.addLayer({id:'edificios-3d',source:'ofm','source-layer':'building',type:'fill-extrusion',minzoom:14.2,filter:['!=',['get','hide_3d'],true],paint:{'fill-extrusion-color':['step',['coalesce',['get','render_height'],3],'#eeeeee',6,'#d9d9d9',12,'#bdbdbd',21,'#969696',33,'#636363'],'fill-extrusion-height':['interpolate',['linear'],['zoom'],14.2,0,15.0,['coalesce',['get','render_height'],3]],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.91}},firstLabel);map.addLayer({id:'cerros-label',source:'ofm','source-layer':'mountain_peak',type:'symbol',minzoom:11,layout:{'text-field':['coalesce',['get','name:es'],['get','name']],'text-font':['Noto Sans Italic'],'text-size':12,'text-offset':[0,1]},paint:{'text-color':'#735f4f','text-halo-color':'rgba(255,255,255,.9)','text-halo-width':1.2}});
map.on('click','edificios-3d',e=>{const p=e.features[0].properties||{};const h=Math.round(Number(p.render_height||0));const pisos=Math.max(1,Math.round(h/3));details.innerHTML=`<div class="row"><b>PISOS EST.</b>${pisos}</div><div class="row"><b>ALTURA 3D</b>${h?h+' m':'Sin dato'}</div><div class="row"><b>ESTADO</b>Referencia visual</div>`;info.classList.add('show')});});
capas.onclick=()=>layerPanel.classList.toggle('open');edif.onchange=()=>setVis(['edificios-3d'],edif.checked);territorios.onchange=()=>setVis(['territorios-line','territorios-label'],territorios.checked);barrios.onchange=()=>setVis(['barrios-line','barrios-label'],barrios.checked);vial.onchange=()=>setVis(['vialidad-estructurante'],vial.checked);verde.onchange=()=>setVis(['parques-destacados'],verde.checked);agua.onchange=()=>setVis(['agua-destacada','cursos-agua'],agua.checked);cerros.onchange=()=>setVis(['cerros-label'],cerros.checked);base.onchange=()=>{(window.BASE_IDS||[]).forEach(id=>{if(map.getLayer(id))try{map.setLayoutProperty(id,'visibility',base.checked?'visible':'none')}catch(e){}})};v2d.onclick=()=>map.easeTo({pitch:0,bearing:0,duration:700});v3d.onclick=()=>map.easeTo({pitch:54,bearing:-18,duration:700});home.onclick=()=>map.easeTo({...HOME,duration:900});close.onclick=()=>info.classList.remove('show');async function buscarDir(){const s=q.value.trim();if(!s)return;const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=cl&q='+encodeURIComponent(s+', Santiago, Chile');try{const r=await fetch(url,{headers:{'Accept-Language':'es'}});const a=await r.json();if(a.length)map.flyTo({center:[+a[0].lon,+a[0].lat],zoom:17,pitch:56,duration:1000});else alert('Dirección no encontrada.')}catch(e){alert('No fue posible buscar la dirección.')}}buscar.onclick=buscarDir;q.addEventListener('keydown',e=>e.key==='Enter'&&buscarDir());
</script></body></html>
