<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maqueta 3D Santiago</title><link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet"><script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><style>*{box-sizing:border-box}html,body,#map{height:100%;margin:0;font-family:Arial;color:#202124}#map{background:#eef1f3}.p{position:absolute;z-index:5;top:14px;left:14px;width:345px;background:#fffffff5;border-radius:14px;box-shadow:0 4px 20px #0002;padding:14px}.p h1{font-size:18px;margin:0}.sub,.status{font-size:11px;color:#6b7280;margin:4px 0 9px}.ok{color:#176b3a}.err{color:#b42318}.row{display:flex;gap:6px;margin-top:7px}.row input{flex:1;padding:9px;border:1px solid #ddd;border-radius:8px}.row button,.layers button,select{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:8px;cursor:pointer}.row button{flex:1}.layers{margin-top:8px;font-size:12px}.layers label{display:block;padding:4px}.info{position:absolute;z-index:5;right:14px;top:14px;width:315px;background:#fffffff5;border-radius:12px;padding:13px;box-shadow:0 3px 18px #0002;display:none}.info.on{display:block}.ir{font-size:12px;border-top:1px solid #eee;padding:6px 0}.ir b{display:inline-block;width:105px}.legend{position:absolute;z-index:4;left:14px;bottom:18px;background:#fffffff2;padding:10px;border-radius:10px;font-size:11px;box-shadow:0 2px 12px #0002}.sw{display:inline-block;width:18px;height:9px;margin:0 4px 0 8px}.maplibregl-ctrl-top-right{top:70px}</style></head><body><div id="map"></div><div class="p"><h1>MAQUETA 3D SANTIAGO</h1><div class="sub">Base SII local optimizada · Parte 1</div><div id="status" class="status">Cargando SII…</div><div class="row"><input id="q" placeholder="ROL o dirección"><button id="buscar">Buscar</button></div><div class="row"><button id="v2">2D</button><button id="v3">3D</button><button id="home">Inicio</button></div><div class="layers"><b>Color de edificios</b><select id="modo"><option value="pisos">Pisos</option><option value="destino">Destino</option><option value="estado">Estado altura</option></select><label><input type="checkbox" id="edif" checked> Edificaciones SII</label><label><input type="checkbox" id="bar" checked> Barrios</label><label><input type="checkbox" id="ter" checked> Territorios</label></div></div><div id="legend" class="legend"><b>PISOS SII</b><br><span class="sw" style="background:#fee08b"></span>1 <span class="sw" style="background:#fdae61"></span>2–3 <span class="sw" style="background:#f46d43"></span>4–6 <span class="sw" style="background:#d73027"></span>7–10 <span class="sw" style="background:#a50026"></span>11–20 <span class="sw" style="background:#542788"></span>21+</div><div id="info" class="info"><button onclick="info.classList.remove('on')" style="float:right;border:0;background:none;font-size:18px">×</button><h3>Edificación SII</h3><div id="det"></div></div><script>
const HOME={center:[-70.6506,-33.4489],zoom:13.7,pitch:54,bearing:-18};const PISO=['step',['coalesce',['get','PISOS'],0],'#64748b',1,'#fee08b',2,'#fdae61',4,'#f46d43',7,'#d73027',11,'#a50026',21,'#542788'];const EST=['match',['coalesce',['get','ESTADO_ALT'],''],'ALTURA VALIDADA','#2563eb','SIN ALTURA DEFINIDA','#f59e0b','#64748b'];const DEST=['match',['coalesce',['get','DESTINO'],''],'HABITACIONAL','#4f86c6','COMERCIO','#e76f51','OFICINA','#8e7dbe','EDUCACION Y CULTURA','#2a9d8f','BODEGA Y ALMACENAJE','#a47148','ESTACIONAMIENTO','#f4a261','#9ca3af'];
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/positron',...HOME,canvasContextAttributes:{antialias:true}});map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
async function loadGzip(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('archivo SII no publicado ('+r.status+')');const ds=new DecompressionStream('gzip');return JSON.parse(await new Response(r.body.pipeThrough(ds)).text())}
function ficha(p){det.innerHTML=[['ROL',p.ROL],['DIRECCIÓN',p.DIRECCION],['DESTINO',p.DESTINO],['PISOS',p.PISOS],['ALTURA',p.ALTURA_M!=null?p.ALTURA_M+' m':null],['FUENTE',p.FUENTE_PISOS],['ESTADO',p.ESTADO_ALT]].map(x=>`<div class="ir"><b>${x[0]}</b>${x[1]??'Sin dato'}</div>`).join('');info.classList.add('on')}
map.on('load',async()=>{map.addSource('barrios',{type:'geojson',data:'data/barrios_oficial.geojson'});map.addSource('territorios',{type:'geojson',data:'data/territorios_oficial.geojson'});map.addLayer({id:'terL',type:'line',source:'territorios',paint:{'line-color':'#111827','line-width':4}});map.addLayer({id:'barL',type:'line',source:'barrios',paint:{'line-color':'#2563eb','line-width':2}});try{const d=await loadGzip('data/sii_compact.geojson.gz');window.SII=d;map.addSource('sii',{type:'geojson',data:d});map.addLayer({id:'sii3d',type:'fill-extrusion',source:'sii',minzoom:12.3,paint:{'fill-extrusion-color':PISO,'fill-extrusion-height':['coalesce',['get','ALTURA_M'],3],'fill-extrusion-base':0,'fill-extrusion-opacity':.9}});map.on('click','sii3d',e=>ficha(e.features[0].properties));status.textContent='SII cargado: '+d.features.length.toLocaleString('es-CL')+' geometrías';status.className='status ok'}catch(e){status.textContent='SII pendiente: '+e.message;status.className='status err'}});
modo.onchange=()=>{if(map.getLayer('sii3d'))map.setPaintProperty('sii3d','fill-extrusion-color',modo.value==='destino'?DEST:modo.value==='estado'?EST:PISO)};edif.onchange=()=>map.getLayer('sii3d')&&map.setLayoutProperty('sii3d','visibility',edif.checked?'visible':'none');bar.onchange=()=>map.setLayoutProperty('barL','visibility',bar.checked?'visible':'none');ter.onchange=()=>map.setLayoutProperty('terL','visibility',ter.checked?'visible':'none');v2.onclick=()=>map.easeTo({pitch:0,bearing:0});v3.onclick=()=>map.easeTo({pitch:54,bearing:-18});home.onclick=()=>map.easeTo(HOME);buscar.onclick=()=>{const s=q.value.trim().toUpperCase();if(!s||!window.SII)return;const f=window.SII.features.find(x=>String(x.properties.ROL||'').toUpperCase().includes(s)||String(x.properties.DIRECCION||'').toUpperCase().includes(s));if(!f)return alert('No encontrado');const b=new maplibregl.LngLatBounds();const w=a=>typeof a[0]==='number'?b.extend(a):a.forEach(w);w(f.geometry.coordinates);map.fitBounds(b,{padding:120,maxZoom:17,pitch:54});ficha(f.properties)};q.addEventListener('keydown',e=>e.key==='Enter'&&buscar.click());
</script></body></html>
